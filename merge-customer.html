<!DOCTYPE html>
<html lang="th">
<head>

<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script src="https://unpkg.com/@emotion/styled@11/dist/emotion-styled.umd.min.js"></script>
<script src="https://unpkg.com/@mui/material@5.15.10/umd/material-ui.production.min.js"></script>

<style>* { box-sizing:border-box; margin:0; padding:0; } body { font-family:'Sarabun',sans-serif; }</style>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const {

  TableHead, TableRow, Checkbox, Button, Tabs, Tab, Badge,

const SIDEBAR_BG    = "#1a3a6b";
const SIDEBAR_ACT   = "#2563b0";
const SIDEBAR_HOVER = "rgba(255,255,255,0.08)";
const SIDEBAR_TEXT  = "rgba(255,255,255,0.85)";
const SIDEBAR_MUTED = "rgba(255,255,255,0.5)";
const LOGO_BG       = "#15306a";
const SEC_HDR       = "#b3d9f5";

const theme = createTheme({
  palette: { primary:{ main:"#1976d2" } },
  typography: { fontFamily:"'Sarabun',Roboto,sans-serif", fontSize:13 },
  components: {
    MuiTableCell: {
      styleOverrides: {
        head: { backgroundColor:"#f5f5f5", fontWeight:600, fontSize:12, color:"#555",
                borderBottom:"1px solid #e0e0e0", padding:"7px 12px", whiteSpace:"nowrap" },
        body: { fontSize:12.5, padding:"5px 12px", borderBottom:"1px solid #f5f5f5" },
      },
    },
    MuiTableRow: { styleOverrides:{ root:{ "&:hover td":{ backgroundColor:"#fafafa" } } } },
    MuiCheckbox:  { styleOverrides:{ root:{ padding:"2px" } } },
    MuiButton:    { styleOverrides:{ root:{ textTransform:"none", fontSize:13 } } },
    MuiTab:       { styleOverrides:{ root:{ textTransform:"none", fontSize:13, minWidth:80, padding:"6px 14px" } } },
  },
});

const Icon = ({ d, size=18 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
    stroke="currentColor" strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round">
    <path d={d}/>

);
const ic = {
  home:     "M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z",
  config:   "M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z",
  database: "M12 2C6.48 2 2 4.02 2 6.5v11C2 19.98 6.48 22 12 22s10-2.02 10-4.5v-11C22 4.02 17.52 2 12 2zM12 9C7.58 9 4 7.43 4 5.5S7.58 2 12 2s8 1.43 8 3.5S16.42 9 12 9z",
  people:   "M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z",
  search:   "M21 21l-4.35-4.35M17 11A6 6 0 1 0 5 11a6 6 0 0 0 12 0z",
  merge:    "M8 7H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3m-1-4l-3 3m0 0l-3-3m3 3V3",

  menu:     "M3 12h18M3 6h18M3 18h18",

const navItems = [
  { id:"home",   label:"Home",     icon:"home" },
  { id:"config", label:"Config",   icon:"config", hasArrow:true },

    id:"customer", label:"Customer", icon:"people", defaultOpen:true,
    children:[
      { id:"search", label:"ค้นหา",        icon:"search" },
      { id:"merge",  label:"รายการ merge", icon:"merge", active:true },
    ],

];

function NavItem({ item, depth=0 }) {
  const [open, setOpen] = useState(!!item.defaultOpen);
  const hasKids = item.children?.length > 0;
  const pl = depth===0 ? 12 : 30;
  return (
    <>
      <div
        onClick={() => hasKids && setOpen(o=>!o)}
        onMouseEnter={e => { if(!item.active) e.currentTarget.style.backgroundColor=SIDEBAR_HOVER; }}
        onMouseLeave={e => { if(!item.active) e.currentTarget.style.backgroundColor="transparent"; }}
        style={{
          display:"flex", alignItems:"center", gap:8,
          paddingLeft:pl, paddingRight:10, paddingTop:7, paddingBottom:7,
          borderRadius:6, marginBottom:2, cursor:"pointer",
          backgroundColor: item.active ? SIDEBAR_ACT : "transparent",
          color: item.active ? "#fff" : SIDEBAR_TEXT,
          fontSize: depth===0 ? 13 : 12.5,
          fontWeight: item.active ? 600 : 400,
          userSelect:"none", transition:"background .15s",
        }}
      >
        <span style={{ color:item.active?"#fff":SIDEBAR_MUTED, display:"flex", flexShrink:0 }}>
          <Icon d={ic[item.icon]} size={depth===0?18:16}/>
        </span>
        <span style={{ flex:1, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{item.label}</span>
        {hasKids && (
          <span style={{ color:SIDEBAR_MUTED, display:"flex", transition:"transform .2s", transform:open?"rotate(180deg)":"none" }}>
            <Icon d={ic.chevD} size={14}/>
          </span>
        )}
        {!hasKids && item.hasArrow && (
          <span style={{ color:SIDEBAR_MUTED, display:"flex" }}><Icon d={ic.chevD} size={14}/></span>
        )}
      </div>
      {hasKids && open && (
        <div>{item.children.map(c=><NavItem key={c.id} item={c} depth={depth+1}/>)}</div>
      )}
    </>
  );
}

function SectionHeader({ title }) {
  return (
    <Box sx={{ backgroundColor:SEC_HDR, px:2, py:"7px" }}>
      <Typography sx={{ fontSize:13, fontWeight:600, color:"#1a3a6b" }}>{title}</Typography>
    </Box>
  );
}

const homeData = [
  { pid:"123", addrId:"0001", detail:"เลขที่: 300/1 หมู่: 7 ถนน: ABC  ตำบล: เมืองเชียงราย อำเภอ: เมือง จังหวัด: เชียงราย 57000" },
  { pid:"124", addrId:"0002", detail:"เลขที่: 300/1 หมู่: 7 ตำบล: เมืองเชียงราย อำเภอ: เมือง จังหวัด: เชียงราย 57000" },
  { pid:"156", addrId:"0003", detail:"เลขที่: 300/1 หมู่: 6 ถนน: ABC  ตำบล: เมืองเชียงราย อำเภอ: เมือง จังหวัด: เชียงราย 57000" },

  { pid:"124", addrId:"0006", detail:"เลขที่: 300/1 หมู่: 7 ตำบล: เมืองเชียงราย อำเภอ: เมือง จังหวัด: เชียงราย 57000" },
  { pid:"156", addrId:"0007", detail:"เลขที่: 300/1 หมู่: 6 ถนน: ABC  ตำบล: เมืองเชียงราย อำเภอ: เมือง จังหวัด: เชียงราย 57000" },

const workData = [
  { pid:"123", addrId:"0011", detail:"หน่วยงาน: เทศบาลเชียงราย ตำบล: เมืองเชียงราย อำเภอ: เมือง จังหวัด: เชียงราย 57000" },
  { pid:"124", addrId:"0012", detail:"หน่วยงาน: เทศบาลเชียงราย ตำบล: เมืองเชียงราย อำเภอ: เมือง จังหวัด: เชียงราย 57000" },
  { pid:"156", addrId:"0013", detail:"เลขที่: 300/1 หมู่: 6 ถนน: ABC  ตำบล: เมืองเชียงราย อำเภอ: เมือง จังหวัด: เชียงราย 57000" },
];

  { pid:"156", productType:"VMI",  policyCode:"VMI6800031",    participantCode:"-", customerType:"payer", updatedDate:"2024-01-01 08:45:00" },

function SelectableTable({ columns, rows, selected, onToggle, rowKey }) {
  return (
    <TableContainer component={Paper} elevation={0} variant="outlined" sx={{ borderRadius:1 }}>
      <Table size="small">
        <TableHead>
          <TableRow>
            <TableCell sx={{ width:52, textAlign:"center" }}>เลือก</TableCell>
            {columns.map(c => <TableCell key={c.key}>{c.label}</TableCell>)}
          </TableRow>
        </TableHead>
        <TableBody>
          {rows.map((row, i) => {
            const key = row[rowKey] + "_" + i;
            const checked = selected.includes(key);
            return (
              <TableRow key={i} sx={{ backgroundColor: checked ? "#f0f7ff" : "inherit" }}>
                <TableCell sx={{ textAlign:"center" }}>
                  <Checkbox size="small" checked={checked} onChange={() => onToggle(key)}
                    sx={{ color:"#aaa", "&.Mui-checked":{ color:"#1976d2" } }}/>
                </TableCell>
                {columns.map(c => (
                  <TableCell key={c.key} sx={{ color:c.muted?"#777":"inherit", whiteSpace:c.wrap?"normal":"nowrap" }}>
                    {row[c.key]}
                  </TableCell>
                ))}
              </TableRow>
            );
          })}
        </TableBody>
      </Table>
    </TableContainer>
  );
}

function App() {
  const [tabVal,      setTabVal]      = useState(0);
  const [selPersonal, setSelPersonal] = useState([]);
  const [selHome,     setSelHome]     = useState([]);
  const [selContact,  setSelContact]  = useState([]);
  const [selWork,     setSelWork]     = useState([]);

  const toggle = setter => key =>
    setter(prev => prev.includes(key) ? prev.filter(k=>k!==key) : [...prev, key]);

  return (
    <ThemeProvider theme={theme}>
      <Box sx={{ display:"flex", height:"100vh", overflow:"hidden" }}>

        {/* SIDEBAR */}
        <Box sx={{ width:210, flexShrink:0, backgroundColor:SIDEBAR_BG, display:"flex", flexDirection:"column" }}>

              </Badge>
              <Box sx={{ display:"flex", alignItems:"center", gap:1, cursor:"pointer" }}>
                <Box sx={{ width:32, height:32, borderRadius:"50%", border:"2px dashed #1976d2", display:"flex", alignItems:"center", justifyContent:"center" }}>

                </Box>
                <Typography sx={{ fontSize:13, color:"#333" }}>Admin (00001)</Typography>
              </Box>
            </Box>
          </Box>

          {/* Content */}

                      onClick={() => alert("ยกเลิก")}>ยกเลิก</Button>
                  </Box>

              {/* ── TAB 1: กรมธรรม์ที่เกี่ยวข้อง ── */}

                  <SectionHeader title="กรมธรรม์ที่เกี่ยวข้อง"/>

                    <TableContainer component={Paper} elevation={0} variant="outlined" sx={{ borderRadius:1 }}>

                              </TableCell>
                              <TableCell sx={{ color:"#666" }}>{row.updatedDate}</TableCell>
                            </TableRow>
                          ))}
                        </TableBody>
                      </Table>
                    </TableContainer>
                  </Box>
                </Box>
              )}

            </Paper>
          </Box>
        </Box>
      </Box>
    </ThemeProvider>

}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
