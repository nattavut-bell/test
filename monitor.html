<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Debt – Monitor Debt</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@emotion/react@11/dist/emotion-react.umd.min.js"></script>
<script src="https://unpkg.com/@emotion/styled@11/dist/emotion-styled.umd.min.js"></script>
<script src="https://unpkg.com/@mui/material@5.15.10/umd/material-ui.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Sarabun', sans-serif; background: #f0f2f5; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const {
  Box, Typography, Paper, Table, TableBody, TableCell, TableContainer,
  TableHead, TableRow, TextField, Breadcrumbs, Link, Divider, Chip, Badge,
  createTheme, ThemeProvider,
} = MaterialUI;

const SIDEBAR_BG    = "#1a3a6b";
const SIDEBAR_ACT   = "#2563b0";
const SIDEBAR_HOVER = "rgba(255,255,255,0.08)";
const SIDEBAR_TEXT  = "rgba(255,255,255,0.85)";
const SIDEBAR_MUTED = "rgba(255,255,255,0.5)";
const LOGO_BG       = "#15306a";

const theme = createTheme({
  palette: { primary: { main: "#1976d2" } },
  typography: { fontFamily: "'Sarabun', Roboto, sans-serif", fontSize: 13 },
  components: {
    MuiTableCell: {
      styleOverrides: {
        head: { backgroundColor:"#f5f5f5", fontWeight:600, fontSize:12, color:"#666", borderBottom:"1px solid #e0e0e0", padding:"8px 12px", whiteSpace:"nowrap" },
        body: { fontSize:13, padding:"5px 12px", borderBottom:"1px solid #f5f5f5" },
      },
    },
    MuiTableRow: { styleOverrides: { root: { "&:hover td": { backgroundColor:"#fafafa" } } } },
    MuiTextField: { defaultProps: { size:"small" } },
    MuiOutlinedInput: { styleOverrides: { root: { fontSize:13, backgroundColor:"#fff" }, input: { padding:"6px 10px" } } },
  },
});

const periodChip = {
  "รายเดือน": { bg:"#e3f2fd", color:"#1565c0" },
  "รายปี":    { bg:"#e8f5e9", color:"#2e7d32" },
  "ราย3ปี":   { bg:"#fff3e0", color:"#e65100" },
};

const rows = [
  { dp:"2026-05-01", pt:"PH",                  ptype:"รายเดือน", total:369839, ded:0, nded:369839 },
  { dp:"2026-05-01", pt:"PH",                  ptype:"รายปี",    total:222,    ded:0, nded:222    },
  { dp:"2026-05-01", pt:"PA30",                ptype:"รายเดือน", total:72679,  ded:0, nded:72679  },
  { dp:"2026-05-01", pt:"PA30",                ptype:"รายปี",    total:24,     ded:0, nded:24     },
  { dp:"2026-05-01", pt:"PL",                  ptype:"รายเดือน", total:10656,  ded:0, nded:10656  },
  { dp:"2026-05-01", pt:"PL",                  ptype:"รายปี",    total:28,     ded:0, nded:28     },
  { dp:"2026-05-01", pt:"House",               ptype:"รายเดือน", total:3225,   ded:0, nded:3225   },
  { dp:"2026-05-01", pt:"House",               ptype:"รายปี",    total:123,    ded:0, nded:123    },
  { dp:"2026-05-01", pt:"House",               ptype:"ราย3ปี",   total:7,      ded:0, nded:7      },
  { dp:"2026-05-01", pt:"CriticalIllness",     ptype:"รายเดือน", total:2716,   ded:0, nded:2716   },
  { dp:"2026-05-01", pt:"CriticalIllness",     ptype:"รายปี",    total:12,     ded:0, nded:12     },
  { dp:"2026-05-01", pt:"ภาคสมัครใจ VMI",     ptype:"รายเดือน", total:27426,  ded:0, nded:27426  },
  { dp:"2026-05-01", pt:"CriticalIllness New", ptype:"รายเดือน", total:244,    ded:0, nded:244    },
  { dp:"2026-05-01", pt:"Cancer",              ptype:"รายเดือน", total:244,    ded:0, nded:244    },
  { dp:"2026-07-01", pt:"ภาคสมัครใจ VMI",     ptype:"รายปี",    total:225,    ded:0, nded:225    },
];

const fmt = n => n.toLocaleString();

const Icon = ({ d, size = 18 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
    stroke="currentColor" strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round">
    <path d={d}/>
  </svg>
);

const ic = {
  home:    "M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z",
  people:  "M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z",
  badge:   "M12 2H2v4l9.29 9.29c.94.94.94 2.46 0 3.41l-2.29 2.3c-.94.94-2.46.94-3.41 0L2 18M7 7h.01M22 13l-5 5",
  swap:    "M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4",
  config:  "M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z",
  monitor: "M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0M12 8v4M12 16h.01",
  credit:  "M3 10h18M7 15h2m4 0h2M3 6h18a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z",
  receipt: "M4 2h16v20l-2-1-2 1-2-1-2 1-2-1-2 1-2-1-2 1ZM8 10h8M8 14h4",
  chart:   "M18 20V10M12 20V4M6 20v-6",
  report:  "M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M16 13H8M16 17H8",
  settings:"M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z",
  menu:    "M3 12h18M3 6h18M3 18h18",
  bell:    "M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0",
  user:    "M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z",
  chevD:   "M6 9l6 6 6-6",
};

const navItems = [
  { id:"home",     label:"Home",          icon:"home"    },
  { id:"debtor",   label:"ข้อมูลลูกหนี้", icon:"people",  hasArrow:true },
  { id:"debttype", label:"ประเภทหนี้",    icon:"badge",   hasArrow:true },
  { id:"transfer", label:"การโอนหนี้",    icon:"swap",    hasArrow:true },
  { id:"config",   label:"Config",        icon:"config",  defaultOpen:true, children:[
    { id:"monitor",    label:"Monitor Debt", icon:"monitor", active:true },
    { id:"configpage", label:"Config",        icon:"credit" },
    { id:"receipt",    label:"ใบแจ้งหนี้",   icon:"receipt" },
  ]},
  { id:"report",   label:"รายงาน",        icon:"report",  children:[
    { id:"rpt1", label:"รายงานหนี้คงค้าง",    icon:"chart" },
    { id:"rpt2", label:"รายงานการชำระหนี้",   icon:"chart" },
    { id:"rpt3", label:"รายงานสรุปรายเดือน",  icon:"chart" },
  ]},
  { id:"settings", label:"การตั้งค่า", icon:"settings", hasArrow:true },
];

function NavItem({ item, depth = 0 }) {
  const [open, setOpen] = useState(!!item.defaultOpen);
  const hasKids = item.children?.length > 0;
  const pl = depth === 0 ? 12 : 28;
  return (
    <>
      <div
        onClick={() => hasKids && setOpen(o => !o)}
        onMouseEnter={e => { if (!item.active) e.currentTarget.style.backgroundColor = SIDEBAR_HOVER; }}
        onMouseLeave={e => { if (!item.active) e.currentTarget.style.backgroundColor = "transparent"; }}
        style={{
          display:"flex", alignItems:"center", gap:8,
          paddingLeft:pl, paddingRight:10, paddingTop:7, paddingBottom:7,
          borderRadius:6, marginBottom:2, cursor:"pointer",
          backgroundColor: item.active ? SIDEBAR_ACT : "transparent",
          color: item.active ? "#fff" : SIDEBAR_TEXT,
          fontSize: depth === 0 ? 13 : 12.5,
          fontWeight: item.active ? 600 : 400,
          userSelect:"none", transition:"background .15s",
        }}
      >
        <span style={{ color: item.active ? "#fff" : SIDEBAR_MUTED, display:"flex", flexShrink:0 }}>
          <Icon d={ic[item.icon]} size={depth === 0 ? 18 : 16}/>
        </span>
        <span style={{ flex:1, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
          {item.label}
        </span>
        {hasKids && (
          <span style={{ color:SIDEBAR_MUTED, display:"flex", transition:"transform .2s", transform: open ? "rotate(180deg)" : "none" }}>
            <Icon d={ic.chevD} size={14}/>
          </span>
        )}
        {!hasKids && item.hasArrow && (
          <span style={{ color:SIDEBAR_MUTED, display:"flex" }}>
            <Icon d={ic.chevD} size={14}/>
          </span>
        )}
      </div>
      {hasKids && open && (
        <div>{item.children.map(c => <NavItem key={c.id} item={c} depth={depth + 1}/>)}</div>
      )}
    </>
  );
}

function App() {
  const [debtDate, setDebtDate] = useState("2026-05-01");
  const totalSum  = rows.reduce((s, r) => s + r.total, 0);
  const nondedSum = rows.reduce((s, r) => s + r.nded,  0);

  return (
    <ThemeProvider theme={theme}>
      <Box sx={{ display:"flex", height:"100vh", overflow:"hidden" }}>

        {/* SIDEBAR */}
        <Box sx={{ width:215, flexShrink:0, backgroundColor:SIDEBAR_BG, display:"flex", flexDirection:"column" }}>
          <Box sx={{ backgroundColor:LOGO_BG, px:2, py:1.5, display:"flex", alignItems:"center", gap:1.5, borderBottom:"1px solid rgba(255,255,255,0.08)" }}>
            <Box sx={{ width:36, height:36, borderRadius:"8px", backgroundColor:"#2563b0", display:"flex", alignItems:"center", justifyContent:"center" }}>
              <Icon d={ic.credit} size={20}/>
            </Box>
            <Box>
              <Typography sx={{ color:"#fff", fontWeight:700, fontSize:16, lineHeight:1.3 }}>Debt</Typography>
              <Box sx={{ display:"inline-block", backgroundColor:"#f44336", borderRadius:"3px", px:"5px", py:"1px", mt:"2px" }}>
                <Typography sx={{ color:"#fff", fontSize:9, fontWeight:700, lineHeight:1 }}>UAT</Typography>
              </Box>
            </Box>
          </Box>
          <Box sx={{ flex:1, overflowY:"auto", px:1, py:1.5,
            "&::-webkit-scrollbar":{ width:3 },
            "&::-webkit-scrollbar-thumb":{ backgroundColor:"rgba(255,255,255,0.15)", borderRadius:4 },
          }}>
            {navItems.map(item => <NavItem key={item.id} item={item} depth={0}/>)}
          </Box>
        </Box>

        {/* MAIN */}
        <Box sx={{ flex:1, display:"flex", flexDirection:"column", overflow:"hidden" }}>
          <Box sx={{ height:52, backgroundColor:"#fff", borderBottom:"1px solid #e8e8e8", display:"flex", alignItems:"center", justifyContent:"space-between", px:2.5, flexShrink:0 }}>
            <Box sx={{ display:"flex", alignItems:"center", gap:1.5 }}>
              <span style={{ display:"flex", color:"#555", cursor:"pointer" }}><Icon d={ic.menu} size={22}/></span>
              <Typography sx={{ fontSize:16, fontWeight:700, color:"#1976d2", ml:0.5 }}>Monitor Debt</Typography>
            </Box>
            <Box sx={{ display:"flex", alignItems:"center", gap:2 }}>
              <Badge badgeContent={3} color="error">
                <span style={{ display:"flex", color:"#666", cursor:"pointer" }}><Icon d={ic.bell} size={20}/></span>
              </Badge>
              <Box sx={{ display:"flex", alignItems:"center", gap:1, cursor:"pointer" }}>
                <Box sx={{ width:32, height:32, borderRadius:"50%", border:"2px dashed #1976d2", display:"flex", alignItems:"center", justifyContent:"center" }}>
                  <span style={{ color:"#1976d2", display:"flex" }}><Icon d={ic.user} size={20}/></span>
                </Box>
                <Typography sx={{ fontSize:13, color:"#333" }}>Admin (00001)</Typography>
              </Box>
            </Box>
          </Box>

          <Box sx={{ flex:1, overflowY:"auto", backgroundColor:"#f0f2f5", p:2.5 }}>
            <Breadcrumbs separator="/" sx={{ mb:1.5 }}>
              <Link underline="hover" href="#" sx={{ fontSize:13, color:"#1976d2" }}>config</Link>
              <Typography sx={{ fontSize:13, color:"#333", fontWeight:500 }}>monitor</Typography>
            </Breadcrumbs>

            <Paper elevation={0} variant="outlined" sx={{ p:2.5, borderRadius:2, backgroundColor:"#fff" }}>
              <Box sx={{ mb:2 }}>
                <Typography variant="caption" color="text.secondary" display="block" sx={{ mb:0.5, fontSize:12 }}>
                  งวดตั้งหนี้
                </Typography>
                <TextField type="date" value={debtDate} onChange={e => setDebtDate(e.target.value)} sx={{ width:170 }}/>
              </Box>
              <Divider sx={{ mb:2 }}/>
              <TableContainer component={Paper} elevation={0} variant="outlined" sx={{ borderRadius:1 }}>
                <Table size="small">
                  <TableHead>
                    <TableRow>
                      {["DebtPeriod","ProductTypeName","PeriodTypeName","total","deductible","nondeductible"].map((h,i) => (
                        <TableCell key={h} align={i>=3?"right":"left"}>{h}</TableCell>
                      ))}
                    </TableRow>
                  </TableHead>
                  <TableBody>
                    {rows.map((row, i) => (
                      <TableRow key={i}>
                        <TableCell sx={{ color:"#888" }}>{row.dp}</TableCell>
                        <TableCell>{row.pt}</TableCell>
                        <TableCell>
                          <Chip label={row.ptype} size="small" sx={{
                            fontSize:11, height:20,
                            backgroundColor: periodChip[row.ptype]?.bg || "#f0f0f0",
                            color: periodChip[row.ptype]?.color || "#333",
                            fontWeight:500, "& .MuiChip-label":{ px:"8px" },
                          }}/>
                        </TableCell>
                        <TableCell align="right">{fmt(row.total)}</TableCell>
                        <TableCell align="right" sx={{ color:"#bbb" }}>0</TableCell>
                        <TableCell align="right">{fmt(row.nded)}</TableCell>
                      </TableRow>
                    ))}
                    <TableRow sx={{ backgroundColor:"#f9f9f9" }}>
                      <TableCell colSpan={3} sx={{ fontWeight:600, color:"#333", borderTop:"1px solid #e0e0e0" }}>รวมทั้งหมด</TableCell>
                      <TableCell align="right" sx={{ fontWeight:600, color:"#333", borderTop:"1px solid #e0e0e0" }}>{fmt(totalSum)}</TableCell>
                      <TableCell align="right" sx={{ fontWeight:600, color:"#bbb", borderTop:"1px solid #e0e0e0" }}>0</TableCell>
                      <TableCell align="right" sx={{ fontWeight:600, color:"#333", borderTop:"1px solid #e0e0e0" }}>{fmt(nondedSum)}</TableCell>
                    </TableRow>
                  </TableBody>
                </Table>
              </TableContainer>
            </Paper>
          </Box>
        </Box>
      </Box>
    </ThemeProvider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
